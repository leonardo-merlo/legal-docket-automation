name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint, type-check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # No env vars needed: Supabase and Google settings are read at request time.
      - run: npm run build

  docker:
    name: web (docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the panel image
        run: docker build web -t legal-docket-web
      # Placeholder settings: the point is that the image starts and serves HTTP,
      # not that it reaches a real Supabase project.
      - name: Start it and check that it answers
        run: |
          docker run -d -p 3000:3000 --name web \
            -e NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder \
            legal-docket-web
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/privacidade || true)
            if [ "$code" != "000" ]; then echo "HTTP $code"; exit 0; fi
            sleep 1
          done
          docker logs web
          exit 1

  agent:
    name: agent (tests)
    # The agent is a Windows desktop process (Chrome over CDP, .bat launchers),
    # so its tests run on Windows too.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Court systems, Supabase and the Claude API are faked. test_chrome_recuperacao
      # is left out: it reproduces a tab frozen by an alert in a real Chrome, and the
      # runner's Chrome does not freeze the same way. It runs locally.
      - run: pytest -q --ignore=test_chrome_recuperacao.py
